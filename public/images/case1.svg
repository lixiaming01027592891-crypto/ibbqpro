  <circle cx="260" cy="210" r="14" fill="#8B6914" opacity="0.65"/>
  <line x1="260" y1="224" x2="260" y2="265" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <line x1="260" y1="235" x2="242" y2="250" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
