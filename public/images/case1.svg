  <line x1="165" y1="245" x2="155" y2="275" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="235" y1="245" x2="245" y2="275" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

