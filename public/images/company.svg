<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="comBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="100%" stop-color="#F0E8DC"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#comBg)"/>

  <!-- 长桌 -->
  <rect x="30" y="200" width="340" height="55" fill="#3D2B1F" opacity="0.12" rx="6"/>

  <!-- 人物 - 多人群体 -->
  <!-- 人物1 -->
  <circle cx="80" cy="155" r="18" fill="#C75B39" opacity="0.7"/>
  <line x1="80" y1="173" x2="80" y2="220" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="80" y1="185" x2="55" y2="210" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="80" y1="185" x2="105" y2="210" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 人物2 -->
  <circle cx="155" cy="145" r="18" fill="#8B6914" opacity="0.7"/>
  <line x1="155" y1="163" x2="155" y2="215" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="175" x2="130" y2="205" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="175" x2="180" y2="205" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 人物3 -->
  <circle cx="245" cy="145" r="18" fill="#C75B39" opacity="0.7"/>
  <line x1="245" y1="163" x2="245" y2="215" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="245" y1="175" x2="220" y2="205" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="245" y1="175" x2="270" y2="205" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 人物4 -->
  <circle cx="320" cy="155" r="18" fill="#8B6914" opacity="0.7"/>
  <line x1="320" y1="173" x2="320" y2="220" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="320" y1="185" x2="295" y2="210" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="320" y1="185" x2="345" y2="210" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- 桌上食物 -->
  <ellipse cx="130" cy="198" rx="22" ry="10" fill="#C75B39" opacity="0.4"/>
  <ellipse cx="200" cy="195" rx="28" ry="12" fill="#8B6914" opacity="0.4"/>
  <ellipse cx="270" cy="198" rx="22" ry="10" fill="#C75B39" opacity="0.4"/>

  <!-- 装饰 -->
  <circle cx="40" cy="40" r="25" fill="#C75B39" opacity="0.08"/>
  <circle cx="360" cy="60" r="20" fill="#8B6914" opacity="0.08"/>
  <path d="M 30 80 Q 50 60 70 75" fill="none" stroke="#8C7B6B" stroke-width="1.5" opacity="0.2" stroke-linecap="round"/>

  <!-- 标签 -->
  <text x="200" y="280" font-family="Noto Sans TC, sans-serif" font-size="14" fill="#3D2B1F" text-anchor="middle" opacity="0.6">公司派對</text>
</svg>
