<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="famBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F1"/>
      <stop offset="100%" stop-color="#F0E8DC"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#famBg)"/>

  <!-- 桌面 -->
  <rect x="40" y="220" width="320" height="60" fill="#3D2B1F" opacity="0.15" rx="8"/>

  <!-- 大人和小孩 - 家庭聚餐 -->
  <!-- 大人1 -->
  <circle cx="130" cy="140" r="22" fill="#C75B39" opacity="0.75"/>
  <line x1="130" y1="162" x2="130" y2="230" stroke="#C75B39" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="130" y1="175" x2="95" y2="210" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="130" y1="175" x2="165" y2="210" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- 大人2 -->
  <circle cx="270" cy="140" r="22" fill="#8B6914" opacity="0.75"/>
  <line x1="270" y1="162" x2="270" y2="230" stroke="#8B6914" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
  <line x1="270" y1="175" x2="235" y2="210" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <line x1="270" y1="175" x2="305" y2="210" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

  <!-- 小孩 -->
  <circle cx="200" cy="165" r="16" fill="#C75B39" opacity="0.6"/>
  <line x1="200" y1="181" x2="200" y2="235" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="195" x2="175" y2="220" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="200" y1="195" x2="225" y2="220" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 桌上的食物 -->
  <ellipse cx="100" cy="215" rx="25" ry="12" fill="#8B6914" opacity="0.5"/>
  <ellipse cx="300" cy="215" rx="25" ry="12" fill="#8B6914" opacity="0.5"/>
  <ellipse cx="200" cy="210" rx="30" ry="14" fill="#C75B39" opacity="0.4"/>

  <!-- 装饰 -->
  <circle cx="50" cy="50" r="20" fill="#C75B39" opacity="0.1"/>
  <circle cx="350" cy="80" r="15" fill="#8B6914" opacity="0.1"/>
  <path d="M 320 60 Q 340 40 360 55" fill="none" stroke="#8C7B6B" stroke-width="2" opacity="0.2" stroke-linecap="round"/>

  <!-- 标签 -->
  <text x="200" y="280" font-family="Noto Sans TC, sans-serif" font-size="14" fill="#3D2B1F" text-anchor="middle" opacity="0.6">家庭聚餐</text>
</svg>
