  </defs>

  <rect width="400" height="300" fill="url(#c2Bg)"/>

  <!-- 民宿建筑 -->
  <rect x="100" y="130" width="200" height="110" fill="none" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" rx="4" opacity="0.5"/>
  <path d="M 90 135 L 200 80 L 310 135" fill="none" stroke="#C75B39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <rect x="140" y="170" width="35" height="35" fill="none" stroke="#8C7B6B" stroke-width="2" opacity="0.4" rx="2"/>
  <rect x="225" y="170" width="35" height="35" fill="none" stroke="#8C7B6B" stroke-width="2" opacity="0.4" rx="2"/>

