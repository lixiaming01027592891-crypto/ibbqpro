  <ellipse cx="188" cy="260" rx="9" ry="15" fill="#C75B39" opacity="0.7"/>
  <ellipse cx="200" cy="256" rx="11" ry="18" fill="#C75B39" opacity="0.8"/>
  <ellipse cx="212" cy="260" rx="9" ry="15" fill="#C75B39" opacity="0.7"/>

  <!-- 人物 -->
  <circle cx="130" cy="230" r="15" fill="#C75B39" opacity="0.6"/>
  <line x1="130" y1="245" x2="130" y2="285" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="255" x2="108" y2="275" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="130" y1="255" x2="150" y2="272" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <circle cx="270" cy="230" r="15" fill="#8B6914" opacity="0.6"/>
  <line x1="270" y1="245" x2="270" y2="285" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="270" y1="255" x2="250" y2="272" stroke="#8B6914" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
