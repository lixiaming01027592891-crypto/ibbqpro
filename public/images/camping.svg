<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="campBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="40%" stop-color="#3D2B1F"/>
      <stop offset="100%" stop-color="#1A0F08"/>
    </linearGradient>
  </defs>

  <!-- 夜空背景 -->
  <rect width="400" height="300" fill="url(#campBg)"/>

  <!-- 月亮 -->
  <circle cx="340" cy="55" r="22" fill="#FAF6F1" opacity="0.8"/>
  <circle cx="332" cy="50" r="18" fill="#2C1810" opacity="0.3"/>

  <!-- 星星 -->
  <circle cx="50" cy="40" r="2" fill="#FAF6F1" opacity="0.6"/>
  <circle cx="100" cy="25" r="1.5" fill="#FAF6F1" opacity="0.5"/>
  <circle cx="180" cy="50" r="2" fill="#FAF6F1" opacity="0.4"/>
  <circle cx="250" cy="35" r="1.5" fill="#FAF6F1" opacity="0.6"/>
  <circle cx="380" cy="120" r="2" fill="#FAF6F1" opacity="0.5"/>
  <circle cx="30" cy="100" r="1.5" fill="#FAF6F1" opacity="0.4"/>
  <circle cx="150" cy="20" r="1.5" fill="#FAF6F1" opacity="0.5"/>

  <!-- 帐篷 -->
  <path d="M 80 240 L 140 140 L 200 240" fill="none" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <line x1="140" y1="140" x2="140" y2="240" stroke="#8C7B6B" stroke-width="2" opacity="0.5"/>

  <!-- 烤肉架 -->
  <ellipse cx="290" cy="235" rx="45" ry="18" fill="none" stroke="#8C7B6B" stroke-width="2.5" opacity="0.7"/>
  <line x1="250" y1="235" x2="240" y2="270" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="330" y1="235" x2="340" y2="270" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 火焰 -->
  <ellipse cx="275" cy="240" rx="10" ry="18" fill="#C75B39" opacity="0.8"/>
  <ellipse cx="290" cy="235" rx="12" ry="22" fill="#C75B39" opacity="0.85"/>
  <ellipse cx="305" cy="240" rx="10" ry="18" fill="#C75B39" opacity="0.8"/>
  <ellipse cx="283" cy="245" rx="7" ry="14" fill="#8B6914" opacity="0.7"/>
  <ellipse cx="297" cy="245" rx="7" ry="14" fill="#8B6914" opacity="0.7"/>

  <!-- 营火辉光 -->
  <ellipse cx="290" cy="250" rx="70" ry="25" fill="#C75B39" opacity="0.15"/>

  <!-- 人物剪影 -->
  <circle cx="240" cy="210" r="14" fill="#C75B39" opacity="0.6"/>
  <line x1="240" y1="224" x2="240" y2="270" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="240" y1="235" x2="220" y2="255" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="240" y1="235" x2="260" y2="250" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 地面 -->
  <ellipse cx="200" cy="275" rx="180" ry="20" fill="#2C1810" opacity="0.5"/>

  <!-- 树木剪影 -->
  <path d="M 30 240 L 45 170 L 60 240" fill="#1A0F08" opacity="0.6"/>
  <path d="M 370 245 L 385 180 L 400 245" fill="#1A0F08" opacity="0.6"/>

  <!-- 标签 -->
  <text x="200" y="295" font-family="Noto Sans TC, sans-serif" font-size="12" fill="#8C7B6B" text-anchor="middle" opacity="0.6">露營烤肉</text>
</svg>
