<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C1810"/>
      <stop offset="50%" stop-color="#3D2B1F"/>
      <stop offset="100%" stop-color="#2C1810"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx="50%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#C75B39" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2C1810" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <ellipse cx="400" cy="380" rx="280" ry="120" fill="url(#fireGlow)"/>

  <!-- 地面 -->
  <ellipse cx="400" cy="420" rx="350" ry="40" fill="#2C1810" opacity="0.5"/>

  <!-- 烤肉架 -->
  <ellipse cx="400" cy="360" rx="120" ry="35" fill="none" stroke="#8C7B6B" stroke-width="3"/>
  <ellipse cx="400" cy="355" rx="110" ry="30" fill="none" stroke="#8B6914" stroke-width="2"/>
  <line x1="320" y1="360" x2="300" y2="420" stroke="#8C7B6B" stroke-width="4" stroke-linecap="round"/>
  <line x1="480" y1="360" x2="500" y2="420" stroke="#8C7B6B" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="360" x2="400" y2="425" stroke="#8C7B6B" stroke-width="3" stroke-linecap="round"/>

  <!-- 火焰 -->
  <ellipse cx="380" cy="370" rx="15" ry="25" fill="#C75B39" opacity="0.8"/>
  <ellipse cx="400" cy="365" rx="18" ry="30" fill="#C75B39" opacity="0.9"/>
  <ellipse cx="420" cy="370" rx="15" ry="25" fill="#C75B39" opacity="0.8"/>
  <ellipse cx="390" cy="375" rx="10" ry="18" fill="#8B6914" opacity="0.7"/>
  <ellipse cx="410" cy="375" rx="10" ry="18" fill="#8B6914" opacity="0.7"/>

  <!-- 烤架上的食物 -->
  <ellipse cx="360" cy="350" rx="18" ry="8" fill="#8B6914" opacity="0.8"/>
  <ellipse cx="400" cy="345" rx="22" ry="9" fill="#8B6914" opacity="0.8"/>
  <ellipse cx="440" cy="350" rx="18" ry="8" fill="#8B6914" opacity="0.8"/>
  <line x1="330" y1="340" x2="470" y2="340" stroke="#8C7B6B" stroke-width="1.5" opacity="0.6"/>
  <line x1="325" y1="350" x2="475" y2="350" stroke="#8C7B6B" stroke-width="1.5" opacity="0.6"/>
  <line x1="330" y1="360" x2="470" y2="360" stroke="#8C7B6B" stroke-width="1.5" opacity="0.6"/>

  <!-- 人物剪影 - 左侧 -->
  <circle cx="220" cy="260" r="18" fill="#C75B39" opacity="0.7"/>
  <line x1="220" y1="278" x2="220" y2="340" stroke="#C75B39" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="220" y1="290" x2="195" y2="320" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="220" y1="290" x2="250" y2="310" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="220" y1="340" x2="205" y2="380" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="220" y1="340" x2="235" y2="380" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 人物剪影 - 右侧 -->
  <circle cx="580" cy="250" r="16" fill="#8B6914" opacity="0.7"/>
  <line x1="580" y1="266" x2="580" y2="330" stroke="#8B6914" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="580" y1="280" x2="555" y2="300" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="580" y1="280" x2="605" y2="305" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="580" y1="330" x2="565" y2="375" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="580" y1="330" x2="595" y2="375" stroke="#8B6914" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 人物剪影 - 中间小孩 -->
  <circle cx="310" cy="290" r="12" fill="#C75B39" opacity="0.6"/>
  <line x1="310" y1="302" x2="310" y2="350" stroke="#C75B39" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="310" y1="315" x2="290" y2="335" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="310" y1="315" x2="330" y2="335" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="310" y1="350" x2="300" y2="385" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="310" y1="350" x2="320" y2="385" stroke="#C75B39" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- 装饰性烟雾 -->
  <path d="M 350 320 Q 340 280 360 250 Q 380 220 370 190" fill="none" stroke="#8C7B6B" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 420 330 Q 430 290 410 260 Q 390 230 400 200" fill="none" stroke="#8C7B6B" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M 450 325 Q 460 295 445 270" fill="none" stroke="#8C7B6B" stroke-width="1.5" opacity="0.25" stroke-linecap="round"/>

  <!-- 星星/火星点缀 -->
  <circle cx="150" cy="150" r="2" fill="#C75B39" opacity="0.5"/>
  <circle cx="650" cy="180" r="2.5" fill="#8B6914" opacity="0.4"/>
  <circle cx="700" cy="120" r="1.5" fill="#C75B39" opacity="0.5"/>
  <circle cx="100" cy="200" r="2" fill="#8B6914" opacity="0.4"/>
  <circle cx="750" cy="250" r="2" fill="#C75B39" opacity="0.3"/>
  <circle cx="80" cy="280" r="1.5" fill="#8B6914" opacity="0.4"/>
  <circle cx="680" cy="300" r="2" fill="#C75B39" opacity="0.4"/>

  <!-- 标题占位文字 -->
  <text x="400" y="100" font-family="Noto Sans TC, sans-serif" font-size="32" fill="#FAF6F1" text-anchor="middle" opacity="0.9">iBBQ Pro 專業烤肉服務</text>
  <text x="400" y="140" font-family="Noto Sans TC, sans-serif" font-size="16" fill="#8C7B6B" text-anchor="middle" opacity="0.7">到府烤肉｜活動派對｜戶外饗宴</text>
</svg>
